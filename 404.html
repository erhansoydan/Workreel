  <script>/*
 * Keeps the page's real address fixed while the app navigates.
 * The hosting frame serves files only from the page's own folder, so a reload
 * at an app route ("/home") would find nothing. The app's route lives in the
 * hash instead ("…/#/home"); the router reads and writes it through these
 * stand-ins for window.location and window.history.
 */
(function () {
  var real = window.location, h = window.history;
  var base = real.pathname;
  // Sign-in links from email land here as "#access_token=…" (or "#error=…").
  // Keep that for the app, then clean the address so routing starts at home.
  if (/^#(access_token|error)=/.test(real.hash)) {
    window.__WR_AUTH_HASH__ = real.hash.slice(1);
    try { h.replaceState(null, '', base + real.search + '#/'); } catch (e) {}
  }
  window.__WR_BASE__ = base.replace(/[^/]*$/, '');
  function route() {
    var r = real.hash.indexOf('#/') === 0 ? real.hash.slice(1) : '/';
    var q = r.indexOf('?');
    return { pathname: q < 0 ? r : r.slice(0, q), search: q < 0 ? '' : r.slice(q) };
  }
  function toRoute(url) {
    if (url == null || url === '') return null;
    var u = new URL(String(url), real.origin + route().pathname + route().search);
    return u.pathname + u.search;
  }
  function realUrl(r) { return base + real.search + '#' + r; }
  var loc = {
    get pathname() { return route().pathname; },
    get search() { return route().search; },
    get hash() { return ''; },
    get href() { var r = route(); return real.origin + r.pathname + r.search; },
    set href(v) { real.href = v; },
    get origin() { return real.origin; },
    get protocol() { return real.protocol; },
    get host() { return real.host; },
    get hostname() { return real.hostname; },
    get port() { return real.port; },
    assign: function (v) { real.assign(v); },
    replace: function (v) { real.replace(v); },
    reload: function () { real.reload(); },
    toString: function () { return this.href; },
  };
  function write(kind, state, url) {
    var r = toRoute(url);
    var target = r ? realUrl(r) : undefined;
    try { h[kind](state, '', target); } catch (e) { if (r) real.hash = r; }
  }
  var hist = {
    get state() { return h.state; },
    get length() { return h.length; },
    get scrollRestoration() { return h.scrollRestoration; },
    set scrollRestoration(v) { try { h.scrollRestoration = v; } catch (e) {} },
    pushState: function (s, t, u) { write('pushState', s, u); },
    replaceState: function (s, t, u) { write('replaceState', s, u); },
    go: function (n) { h.go(n); },
    back: function () { h.back(); },
    forward: function () { h.forward(); },
  };
  window.__WR_LOC__ = loc;
  window.__WR_HIST__ = hist;
})();
</script>
